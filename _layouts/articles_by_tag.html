---
layout: default
---

<article class="typo">
<h1>#{{ page.title }}</h1>
{% if site.tags[page.slug] %}
<ul>
  {% for post in site.tags[page.slug] %}
    <li>
      <a href="{{ post.url | relative_url }}" title="{{ post.title }}">
        {{ post.title }}
      </a>
      <small><span style="padding: 0 .5rem;">-</span>{{ post.date | date: site.theme_config.date_format }}</small>
    </li>
  {% endfor %}
</ul>
{% else %}
  <p>
    There are no posts in {{ page.slug }}.
  </p>
{% endif %}
</article>

<a href="{{ "/tags" | relative_url }}">返回Tags页面</a>
